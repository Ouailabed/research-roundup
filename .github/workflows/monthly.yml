name: Monthly issue

on:
  schedule:
    - cron: "23 7 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to build, for example 2026-10. Leave empty for the last full month."
        required: false

permissions:
  contents: write

# The weekly and monthly jobs both write the database, which git can't merge, so they take turns.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  build-issue:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MONTH: ${{ inputs.month }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # Score anything the last weekly run left, so the issue is chosen from the whole month.
      - run: python -m src.main analyse
      - run: python -m src.main build-issue ${MONTH:+--month "$MONTH"}
      - name: Save the issue
        run: |
          git config user.name "research-roundup-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Monthly issue"
          git pull --rebase
          git push
