name: Weekly run

on:
  schedule:
    - cron: "13 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# The weekly and monthly jobs both write the database, which git can't merge, so they take turns.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  collect-and-analyse:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        # A run that waited its turn must start from the newest database, not the one it was queued with.
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main run
      # If the run fails partway, keep what it finished.
      - name: Save the results
        if: ${{ !cancelled() }}
        run: |
          git config user.name "research-roundup-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Weekly run: new papers and analysis"
          git pull --rebase
          git push
