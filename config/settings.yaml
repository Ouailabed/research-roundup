# Model names live here because Groq changes its list often.
models:
  # Scoring models, tried in order. Limits are per model, so when one uses up
  # its daily allowance the next takes over.
  cheap:
    - openai/gpt-oss-20b
    - openai/gpt-oss-120b
  strong: openai/gpt-oss-120b

# Papers first seen before this date are kept but not analysed.
analyse_from: "2026-09-01"
