# Model names live here because Groq changes its list often.
models:
  # Scoring models, tried in order. Limits are per model, so when one uses up
  # its daily allowance the next takes over.
  cheap:
    - openai/gpt-oss-20b
    - openai/gpt-oss-120b
  strong: openai/gpt-oss-120b
  # Checks each write-up against its abstract. Of three free Groq models it agreed best with the
  # 2 November audit, though it is the same model that writes the write-ups. See the README.
  checker: openai/gpt-oss-120b

# Papers first seen before this date are kept but not analysed.
analyse_from: "2026-09-01"

# Linked from the foot of each newsletter.
site_url: https://ouailabed.github.io/research-roundup/
