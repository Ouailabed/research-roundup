    notes: Research Discussion Papers through Crossref. The bank's own feed holds only the latest paper.

  - name: Reserve Bank of New Zealand
    group: g10_central_bank
    type: html
    status: not_covered
    url: https://www.rbnz.govt.nz/research-and-publications/analytical-notes
    notes: Not covered. The site answered 403 to a script on 31 October 2026, and we never disguise the script as a browser. RePEc IDEAS stops at 2023 for Discussion Papers and 2024 for Analytical Notes.

  - name: Boston Fed
    group: regional_fed
    type: html
    reader: repec
    status: fallback
    url: https://ideas.repec.org/s/fip/fedbwp.html
    notes: Crossref has the DOIs (prefix 10.29412) but no abstracts, so we use RePEc IDEAS.

  - name: New York Fed
    group: regional_fed
