  - name: American Economic Review
    group: journal
    type: api
    reader: openalex
    issn: 0002-8282
    url: https://api.openalex.org/works
    notes: OpenAlex had abstracts for 25 of 25 recent articles on 31 October 2026.

  - name: Econometrica
    group: journal
    type: api
    reader: crossref
    url: https://api.crossref.org/journals/0012-9682/works
    notes: Crossref had abstracts for 20 of 25 recent articles. Its published date shows only the year, so we use its created date.

  - name: Journal of Political Economy
    group: journal
