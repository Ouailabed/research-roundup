<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Research Roundup</title>
<style>
  body { margin: 0; padding: 40px 18px; background: #eef1f5; color: #1c2733; font-family: Georgia, "Times New Roman", serif; }
  main { max-width: 600px; margin: 0 auto; padding: 28px 32px; background: #ffffff; }
  h1 { margin: 0 0 8px; font-size: 30px; font-weight: normal; color: #12263a; }
  p { margin: 0 0 20px; font-size: 16px; line-height: 1.5; }
  ul { margin: 0; padding-left: 20px; font-size: 17px; line-height: 1.8; }
  a { color: #17527a; }
</style>
</head>
<body>
<main>
  <h1>The Research Roundup</h1>
  <p>A monthly newsletter of new economics research for a markets research team.</p>
  <ul>
    {% for issue in issues %}
    <li><a href="issues/{{ issue.file }}">{{ issue.label }}</a></li>
    {% endfor %}
  </ul>
</main>
</body>
</html>
